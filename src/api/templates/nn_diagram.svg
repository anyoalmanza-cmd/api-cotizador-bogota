<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <style>
    .title { font: bold 20px sans-serif; fill:#1a1a2e }
    .label { font: 14px sans-serif; fill:#1a1a2e }
    .node { fill:#ffffff; stroke:#1a3a5c; stroke-width:2 }
    .node-input { fill:#ffd6d6; stroke:#b91c1c }
    .node-hidden { fill:#e6f2ff; stroke:#1d4ed8 }
    .node-output { fill:#dff7e6; stroke:#16a34a }
    .bias { fill:#f3f4f6; stroke:#64748b }
    .conn { stroke:#333; stroke-width:1.2 }
  </style>

  <text x="20" y="30" class="title">Diagrama de la red (esquema)</text>

  <!-- Input layer -->
  <text x="30" y="70" class="label">Entradas</text>
  <!-- draw several input nodes -->
  <g id="inputs">
    <circle cx="80" cy="110" r="18" class="node-input" />
    <text x="60" y="116" class="label">x1</text>

    <circle cx="80" cy="165" r="18" class="node-input" />
    <text x="60" y="171" class="label">x2</text>

    <circle cx="80" cy="220" r="18" class="node-input" />
    <text x="60" y="226" class="label">...</text>

    <circle cx="80" cy="275" r="18" class="node-input" />
    <text x="60" y="281" class="label">xn</text>

    <!-- bias input -->
    <rect x="60" y="305" width="36" height="20" rx="4" class="bias" />
    <text x="70" y="320" class="label">+1</text>
  </g>

  <!-- Hidden layer 1 (128) -->
  <text x="280" y="70" class="label">Capa oculta 1 (128 neuronas)</text>
  <g id="hidden1">
    <!-- show 5 representative neurons vertically -->
    <circle cx="320" cy="90" r="16" class="node-hidden" />
    <circle cx="320" cy="150" r="16" class="node-hidden" />
    <circle cx="320" cy="210" r="16" class="node-hidden" />
    <circle cx="320" cy="270" r="16" class="node-hidden" />
    <circle cx="320" cy="330" r="16" class="node-hidden" />
    <rect x="300" y="350" width="36" height="20" rx="4" class="bias" />
    <text x="310" y="365" class="label">+1</text>
  </g>

  <!-- Hidden layer 2 (64) -->
  <text x="560" y="70" class="label">Capa oculta 2 (64 neuronas)</text>
  <g id="hidden2">
    <circle cx="600" cy="120" r="14" class="node-hidden" />
    <circle cx="600" cy="170" r="14" class="node-hidden" />
    <circle cx="600" cy="220" r="14" class="node-hidden" />
    <circle cx="600" cy="270" r="14" class="node-hidden" />
    <rect x="590" y="300" width="36" height="20" rx="4" class="bias" />
    <text x="600" y="315" class="label">+1</text>
  </g>

  <!-- Output layer -->
  <text x="820" y="70" class="label">Salida</text>
  <g id="output">
    <circle cx="860" cy="200" r="22" class="node-output" />
    <text x="845" y="205" class="label">y</text>
  </g>

  <!-- Connections (representative lines) -->
  <!-- from inputs to hidden1 -->
  <g stroke="none">
    <path d="M100,110 C180,110 240,90 304,90" class="conn" fill="none" />
    <path d="M100,165 C180,165 240,150 304,150" class="conn" fill="none" />
    <path d="M100,220 C180,220 240,210 304,210" class="conn" fill="none" />
    <path d="M100,275 C180,275 240,270 304,270" class="conn" fill="none" />
  </g>

  <!-- hidden1 to hidden2 -->
  <g stroke="none">
    <path d="M344,90 C420,90 480,120 588,120" class="conn" fill="none" />
    <path d="M344,150 C420,150 480,170 588,170" class="conn" fill="none" />
    <path d="M344,210 C420,210 480,220 588,220" class="conn" fill="none" />
    <path d="M344,270 C420,270 480,270 588,270" class="conn" fill="none" />
  </g>

  <!-- hidden2 to output -->
  <g stroke="none">
    <path d="M614,120 C720,140 780,170 838,182" class="conn" fill="none" />
    <path d="M614,170 C720,180 780,185 838,190" class="conn" fill="none" />
    <path d="M614,220 C720,200 780,190 838,195" class="conn" fill="none" />
    <path d="M614,270 C720,220 780,200 838,205" class="conn" fill="none" />
  </g>

  <!-- Legend -->
  <rect x="30" y="350" width="220" height="50" rx="6" fill="#fff" stroke="#e2e8f0" />
  <text x="40" y="370" class="label">Leyenda:</text>
  <text x="40" y="390" class="label">• Capa oculta 1 = 128 unidades (representadas)</text>
  <text x="40" y="408" class="label">• Capa oculta 2 = 64 unidades (representadas)</text>

</svg>
